<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Чат поверх игры</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #list { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: .35em .6em; overflow-wrap: anywhere; animation: in .3s ease; transition: opacity .6s;
         text-shadow: 0 1px 2px #000, 0 0 6px #000a; }
  .msg.card { background: color-mix(in srgb, var(--card) var(--bgp, 55%), transparent);
              box-shadow: 0 0 0 1px color-mix(in srgb, var(--edge) var(--bgp, 55%), transparent); }
  .msg.gone { opacity: 0; }
  .msg.system { color: #ffb24a; font-size: .85em; }
  .sep { color: var(--muted); }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  /* Режим настройки: окно можно перетащить и растянуть */
  #edit { display: none; position: absolute; inset: 0; border: 2px dashed #9a3fd6; border-radius: 10px; background: rgba(15,11,10,.45);
          -webkit-app-region: drag; cursor: move; }
  #edit p { position: absolute; top: 8px; left: 10px; right: 10px; margin: 0; font: 700 13px 'Manrope', sans-serif; color: #fff;
            text-shadow: 0 1px 3px #000; }
  body.edit #edit { display: block; }
</style></head>
<body class="t-general" data-mode="f">
<div id="list"></div>
<div id="edit"><p>Режим настройки: перетащите окно мышью. Размер меняется в Crossember → Настройки → Чат поверх игры. Готово — снова нажмите горячую клавишу или кнопку в Crossember.</p></div>
<script src="/a/overlay.js"></script><script src="/a/chat.js"></script>
</body></html>
