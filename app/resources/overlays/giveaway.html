<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Розыгрыш</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; padding: .85em 1.1em 1em; text-align: center; }
  #stage.empty { display: none; }
  .kick { font: 800 .55em 'Manrope', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--kicker); }
  .top { display: flex; align-items: baseline; justify-content: center; gap: .8em; }
  .clock { font: 800 .8em var(--title); font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .prize { margin-top: .25em; font: 800 1.05em var(--title); line-height: 1.2; word-break: break-word; }
  .call { margin-top: .5em; font: 600 .75em 'Manrope', sans-serif; color: var(--muted); }
  .call b { font: 800 1.15em var(--title); color: var(--fg); padding: .05em .45em; border-radius: .4em; box-shadow: 0 0 0 1.5px var(--edge); margin: 0 .15em; }
  .sub { margin-top: .45em; font: 600 .55em 'Manrope', sans-serif; color: var(--muted); }
  .count { margin-top: .5em; font: 800 .7em var(--title); font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-weight: 600; font-family: 'Manrope', sans-serif; }
  .roll { margin: .35em 0 .1em; height: 1.5em; overflow: hidden; font: 800 1.6em var(--title); line-height: 1.5em; white-space: nowrap; text-overflow: ellipsis; }
  .roll.blur { filter: blur(.02em); opacity: .85; }
  .wins { margin-top: .3em; display: flex; flex-direction: column; gap: .1em; }
  .wn { font: 800 1.6em var(--title); line-height: 1.2; word-break: break-word; animation: rise .7s cubic-bezier(.2, 1.2, .4, 1); }
  .wins.many .wn { font-size: 1.05em; }
  .ok { font: 800 .45em 'Manrope', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--kicker); vertical-align: middle; margin-left: .6em; }
  .for { margin-top: .35em; font: 600 .65em 'Manrope', sans-serif; color: var(--muted); }
  @keyframes rise { 0% { opacity: 0; transform: translateY(.4em) scale(.96); } 100% { opacity: 1; transform: none; } }
</style></head>
<body class="t-general"><div id="stage" class="card empty"></div>
<script src="/a/overlay.js"></script><script src="/a/giveaway.js"></script>
</body></html>
