<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Топ донатеров</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; }
  .box { padding: .8em 1em; }
  .head { font: 800 .62em 'Manrope', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--kicker); margin-bottom: .5em; }
  .row { display: flex; align-items: baseline; gap: .6em; padding: .22em 0; opacity: 0; transform: translateX(-10px); animation: in .4s forwards; }
  .pos { font: 800 .8em var(--title); width: 1.6em; color: var(--muted); }
  .row:first-of-type .pos { color: var(--accent); }
  .nm { flex: 1; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum { font: 800 .9em var(--title); }
  .empty { color: var(--muted); font-size: .8em; }
  @keyframes in { to { opacity: 1; transform: none; } }
</style></head>
<body class="t-general"><div id="stage"></div>
<script src="/a/overlay.js"></script><script src="/a/top.js"></script>
</body></html>
