<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Аукцион</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; padding: .9em 1.1em 1em; }
  #stage.empty { display: none; }
  .top { display: flex; align-items: baseline; gap: .8em; margin-bottom: .55em; }
  .kick { font: 800 .55em 'Manrope', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--kicker); }
  .state { font: 600 .6em 'Manrope', sans-serif; color: var(--muted); }
  .clock { margin-left: auto; font: 800 1.25em var(--title); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .clock.low { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .clock.paused { opacity: .55; }
  @keyframes pulse { 50% { opacity: .55; } }
  .lots { display: flex; flex-direction: column; gap: .5em; }
  .lot { position: relative; }
  .line { display: flex; align-items: baseline; gap: .5em; }
  .num { font: 800 .6em 'Manrope', sans-serif; color: var(--muted); min-width: 1.8em; font-variant-numeric: tabular-nums; }
  .nm { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val { font: 800 .85em var(--title); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct { font: 600 .65em 'Manrope', sans-serif; color: var(--muted); margin-left: .35em; font-variant-numeric: tabular-nums; }
  .track { height: .32em; margin-top: .28em; border-radius: 1em; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .fill { height: 100%; border-radius: 1em; background: var(--grad); transition: width .7s cubic-bezier(.2, .8, .3, 1); }
  .lot.lead .nm { color: var(--fg); }
  .lot:not(.lead) .fill { opacity: .7; }
  .bump { animation: bump .6s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes bump { 0% { transform: translateX(.4em); } 100% { transform: none; } }
  .foot { margin-top: .6em; font: 600 .6em 'Manrope', sans-serif; color: var(--muted); display: flex; gap: 1em; }
  .win { text-align: center; padding: .4em 0 .2em; animation: rise .8s cubic-bezier(.2, 1.2, .4, 1); }
  .win .kick { display: block; margin-bottom: .4em; }
  .win .wn { font: 800 1.6em var(--title); line-height: 1.15; word-break: break-word; }
  .win .ws { margin-top: .3em; font: 800 .9em var(--title); color: var(--muted); font-variant-numeric: tabular-nums; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(.6em) scale(.96); } 100% { opacity: 1; transform: none; } }
</style></head>
<body class="t-general"><div id="stage" class="card empty"></div>
<script src="/a/overlay.js"></script><script src="/a/auction.js"></script>
</body></html>
