<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Последний донат</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; display: flex; flex-direction: column; gap: .4em; }
  .item { padding: .5em .9em; display: flex; align-items: baseline; gap: .6em; white-space: nowrap; overflow: hidden; }

  .sum { font: 800 .9em var(--title); }

  @keyframes pop { 0% { transform: scale(.94); opacity: .4; } 100% { transform: none; opacity: 1; } }
