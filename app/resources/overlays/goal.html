<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Сбор средств</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 16px; right: 16px; top: 16px; padding: .85em 1.1em 1em; transition: box-shadow .4s ease; }
  #stage.empty { display: none; }
  .top { display: flex; align-items: baseline; gap: .8em; }
  .kick { font: 800 .55em 'Manrope', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--kicker); }
  .state { font: 600 .6em 'Manrope', sans-serif; color: var(--muted); }
  .clock { margin-left: auto; font: 800 .8em var(--title); font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .title { margin-top: .2em; font: 800 1.05em var(--title); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { display: flex; align-items: baseline; gap: .45em; margin-top: .45em; }
  .got { font: 800 1.25em var(--title); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .of { font: 800 .7em var(--title); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct { margin-left: auto; font: 800 .8em var(--title); font-variant-numeric: tabular-nums; }
  .track { position: relative; height: .5em; margin-top: .4em; border-radius: 1em; background: rgba(255, 255, 255, .08); }
  .fill { height: 100%; border-radius: 1em; background: var(--grad); transition: width .9s cubic-bezier(.2, .8, .3, 1); }
  .tick { position: absolute; top: -.18em; bottom: -.18em; width: .12em; margin-left: -.06em; border-radius: .1em; background: rgba(255, 255, 255, .35); }
  .tick.on { background: rgba(0, 0, 0, .45); }
  .next { margin-top: .5em; font: 600 .6em 'Manrope', sans-serif; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next b { color: var(--fg); font-weight: 800; }
  .foot { display: flex; gap: 1.4em; margin-top: .55em; font: 600 .6em 'Manrope', sans-serif; color: var(--muted); min-width: 0; }
  .foot > div { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot b { color: var(--fg); font-weight: 800; }
  .foot .lbl { font-size: .85em; letter-spacing: .14em; text-transform: uppercase; color: var(--kicker); margin-right: .5em; }
  .tops { display: flex; gap: 1em; }
  .bump { animation: bump .6s cubic-bezier(.2, 1.4, .4, 1); display: inline-block; }
  @keyframes bump { 0% { transform: scale(1.18); } 100% { transform: none; } }
  .party { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: .6em 1em; animation: rise .7s cubic-bezier(.2, 1.2, .4, 1); }
  .party .kick { margin-bottom: .35em; }
  .party .pn { font: 800 1.35em var(--title); line-height: 1.15; word-break: break-word; }
  .party .ps { margin-top: .25em; font: 800 .75em var(--title); color: var(--muted); font-variant-numeric: tabular-nums; }
  #stage.partying > :not(.party) { visibility: hidden; }
  .party.out { animation: fade .5s ease forwards; }
  @keyframes rise { 0% { opacity: 0; transform: scale(.94); } 100% { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 0; } }
</style></head>
<body class="t-general"><div id="stage" class="card empty"></div>
<script src="/a/overlay.js"></script><script src="/a/goal.js"></script>
</body></html>
