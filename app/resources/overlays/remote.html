<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossember · Чат (второй ПК)</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f12; }
  body.t-campfire { background: #0f0b0a; }
  body { --fs: 16px; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--edge); font-size: 14px; }
  header b { font-family: var(--title); font-size: 15px; }
  header .st { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #chat { overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
  #events { overflow-y: auto; border-left: 1px solid var(--edge); padding: 10px 12px; font-size: 14px; }
  #events h3, .hint { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
  .ev { padding: 8px 10px; margin-bottom: 6px; }
  .ev small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .msg { padding: 4px 8px; border-radius: 8px; cursor: pointer; overflow-wrap: anywhere; }
  .msg:hover { background: rgba(255,255,255,.06); }
  .msg.pinned { box-shadow: inset 3px 0 0 var(--accent); background: rgba(255,255,255,.06); }
  .sep { color: var(--muted); }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--edge); }
  input { flex: 1; background: rgba(255,255,255,.06); border: 1px solid var(--edge); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; outline: none; }
  button { background: var(--grad); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; font: 800 14px 'Manrope', sans-serif; cursor: pointer; }
  #err { color: #ff7a84; font-size: 13px; padding: 0 14px 8px; min-height: 0; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } #events { display: none; } }
</style></head>
<body class="t-general">
  <header><b>Crossember</b><span>чат для второго ПК</span><span class="st" id="st">подключение…</span></header>
  <main>
    <div id="chat"></div>
    <aside id="events"><h3>События</h3><div id="evlist"></div><p class="hint">Клик по сообщению — вывести в оверлей «Закреп», повторный клик — снять</p></aside>
  </main>
  <div>
    <div id="err"></div>
    <form id="f"><input id="t" maxlength="500" placeholder="Написать в чат Twitch…" autocomplete="off"><button>Отправить</button></form>
  </div>
<script src="/a/overlay.js"></script><script src="/a/remote.js"></script>
</body></html>
