<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossember · Алерты</title>
<link rel="stylesheet" href="/a/overlay.css">
<style>
  #stage { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); }
  .alert { display: flex; align-items: center; gap: 28px; padding: 26px 44px 26px 26px; max-width: 1400px;
           opacity: 0; transform: translateY(-30px) scale(.96); transition: opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1.2); }
  .alert.show { opacity: 1; transform: none; }
  .icon { width: 96px; height: 96px; border-radius: 22px; background: var(--grad); display: grid; place-items: center;
          font: 800 44px var(--title); color: #fff; flex: none; }
  .kicker { font: 800 20px 'Manrope', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--kicker); }
  .who { font: 800 46px/1.15 var(--title); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 900px; }
  .amt { margin-left: 18px; }
  .text { font: 600 26px/1.35 'Manrope', sans-serif; color: var(--muted); margin-top: 10px; max-width: 1050px; overflow-wrap: anywhere; }
  .test { font-size: 16px; color: var(--muted); margin-left: 14px; letter-spacing: .1em; }
</style></head>
<body class="t-general"><div id="stage"></div>
<script src="/a/overlay.js"></script><script src="/a/alert.js"></script>
</body></html>
